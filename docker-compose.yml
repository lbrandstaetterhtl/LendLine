services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: lendline
      # Set POSTGRES_PASSWORD (and DATABASE_URL to match) for anything but local development.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lendline}
      POSTGRES_DB: lendline
    ports:
      # Loopback only: the database must not be reachable from the network.
      - "127.0.0.1:5432:5432"
    volumes:
      - lendline_pg:/var/lib/postgresql/data

volumes:
  lendline_pg:
