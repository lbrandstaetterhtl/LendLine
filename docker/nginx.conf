# Runs as the unprivileged `node` user: everything writable lives under /tmp, logs go to the console.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  server_tokens off;
  sendfile on;

  client_body_temp_path /tmp/nginx-client-body;
  proxy_temp_path /tmp/nginx-proxy;
  fastcgi_temp_path /tmp/nginx-fastcgi;
  uwsgi_temp_path /tmp/nginx-uwsgi;
  scgi_temp_path /tmp/nginx-scgi;

  server {
    listen 9000;
    root /app/frontend;

    # Device images: up to 8 files of 5 MB each per request.
    client_max_body_size 50m;

    location /api/ {
      proxy_pass http://127.0.0.1:3001;
      proxy_set_header Host $host;
      # Replaces, not appends: the API trusts this header from loopback (audit log, rate limits),
      # so a client must not be able to put its own addresses in front.
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Built assets carry a content hash in their name.
    location /assets/ {
      expires 1y;
      add_header Cache-Control "public, immutable";
    }

    # Client-side routes (React Router) all load index.html.
    location / {
      try_files $uri /index.html;
    }
  }
}
